name: agrilink_mobile
description: "AgriLink Sri Lanka: the Android app for farmers, officers, buyers and admins."
publish_to: 'none'

version: 1.0.0+1

# The whole team pins Flutter 3.47.5 (Dart 3.13.4). Don't change this without agreeing as a team.
environment:
  sdk: ^3.13.4
  flutter: 3.47.5

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.0.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/arb (see l10n.yaml).
  generate: true

  assets:
    # Crop icons and default role avatars from the website (tool/import_web_icons.dart).
    - assets/icons/crops/
    - assets/icons/avatars/
    # Canopy photos, the same as the website's: one per crop type (free Unsplash photos, credits in
    # lib/shared/media/crop_photos.dart) and the Sri Lankan field and market scenes.
    - assets/photos/crops/
    - assets/photos/scenes/

  # Bundled rather than downloaded at runtime. All are SIL Open Font Licence (see assets/fonts/OFL-*.txt).
  # Abhaya Libre and Yaldevi carry Latin and Sinhala (both by Mooniak, Sri Lanka), as on the website;
  # Tamil falls back to Noto Sans Tamil. Yaldevi ships as a variable font, so these are static
  # weights cut from it with fonttools (see assets/fonts/README.md).
  fonts:
    - family: AbhayaLibre
      fonts:
        - asset: assets/fonts/AbhayaLibre-Medium.ttf
          weight: 500
        - asset: assets/fonts/AbhayaLibre-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AbhayaLibre-Bold.ttf
          weight: 700
        - asset: assets/fonts/AbhayaLibre-ExtraBold.ttf
          weight: 800
    - family: Yaldevi
      fonts:
        - asset: assets/fonts/Yaldevi-Regular.ttf
        - asset: assets/fonts/Yaldevi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Yaldevi-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Yaldevi-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala-Regular.ttf
        - asset: assets/fonts/NotoSansSinhala-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSinhala-Bold.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
