name: agrilink_mobile
description: "AgriLink Sri Lanka: the Android app for farmers, officers, buyers and admins."
publish_to: 'none'

version: 1.0.0+1

# The whole team pins Flutter 3.47.5 (Dart 3.13.4). Don't change this without agreeing as a team.
environment:
  sdk: ^3.13.4
  flutter: 3.47.5

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.0.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  http_mock_adapter: ^0.6.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/arb (see l10n.yaml).
  generate: true

  # Bundled rather than downloaded at runtime. All are SIL Open Font Licence (see assets/fonts/OFL-*.txt).
  # Fraunces, Plus Jakarta Sans and JetBrains Mono have no Sinhala or Tamil glyphs, so the theme
  # falls back to the two Noto families for those scripts.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
        - asset: assets/fonts/Fraunces-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala-Regular.ttf
        - asset: assets/fonts/NotoSansSinhala-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSinhala-Bold.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
