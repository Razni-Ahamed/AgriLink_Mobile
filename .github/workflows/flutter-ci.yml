name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version the whole team pins in pubspec.yaml.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      # Also generates the translations (lib/l10n/generated is gitignored).
      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test
